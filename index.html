<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project 2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: #2e2e7e;
      background: linear-gradient(165deg, #ffab5e 0%, #f97b22 45%, #ea6a12 100%);
      overflow: hidden;
    }

    /* Soft leaf shapes, like floating petals */
    .leaf {
      position: fixed;
      border-radius: 0 100% 0 100%;
      pointer-events: none;
      z-index: 0;
    }
    .leaf-1 {
      width: 520px; height: 520px;
      top: -140px; left: -140px;
      background: rgba(255, 255, 255, 0.18);
      transform: rotate(18deg);
    }
    .leaf-2 {
      width: 680px; height: 680px;
      bottom: -200px; right: -180px;
      background: rgba(46, 46, 126, 0.12);
      transform: rotate(-14deg);
    }
    .leaf-3 {
      width: 260px; height: 260px;
      top: 58%; left: 12%;
      background: rgba(255, 255, 255, 0.10);
      transform: rotate(40deg);
    }

    /* White logo tile, like the app icon in the design */
    .logo {
      position: fixed;
      top: 24px; left: 24px;
      width: 52px; height: 52px;
      border-radius: 16px;
      background: #ffffff;
      display: grid;
      place-items: center;
      box-shadow: 0 12px 24px rgba(46, 46, 126, 0.2);
      z-index: 2;
    }
    .logo::before {
      content: "";
      width: 22px; height: 22px;
      background: #3d3d9e;
      border-radius: 0 100% 0 100%;
      transform: rotate(-8deg);
    }

    /* Centered white card */
    .card {
      position: relative;
      z-index: 1;
      width: min(520px, 90vw);
      text-align: center;
      padding: 4rem 3rem;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 32px 64px rgba(46, 46, 126, 0.28);
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    .card__dot {
      position: absolute;
      top: 26px; right: 30px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #f2c744;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50%      { opacity: 1; transform: scale(1.25); }
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      font-weight: 600;
      letter-spacing: 1px;
      color: #2e2e7e;
    }

    p {
      margin-top: 1.1rem;
      font-size: 1.15rem;
      color: #55559d;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      margin-top: 2.4rem;
      padding: 0.9rem 2.6rem;
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      border-radius: 50px;
      background: #3d3d9e;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn:hover {
      background: #2c2c7c;
      box-shadow: 0 14px 30px rgba(46, 46, 126, 0.35);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="leaf leaf-1"></div>
  <div class="leaf leaf-2"></div>
  <div class="leaf leaf-3"></div>
  <div class="logo" aria-hidden="true"></div>

  <main class="card">
    <span class="card__dot" aria-hidden="true"></span>
    <h1>Hello Dubai</h1>
    <p>Hello! This is my flashy second project ✨</p>
    <a class="btn" href="#">Get Started</a>
  </main>
</body>
</html>
