<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Project 2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: #2e2e7e;
      background: linear-gradient(165deg, #ffab5e 0%, #f97b22 45%, #ea6a12 100%);
      overflow-x: hidden;
    }

    /* Soft leaf shapes, like floating petals */
    .leaf {
      position: fixed;
      border-radius: 0 100% 0 100%;
      pointer-events: none;
      z-index: 0;
    }
    .leaf-1 {
      width: 520px; height: 520px;
      top: -140px; left: -140px;
      background: rgba(255, 255, 255, 0.18);
      transform: rotate(18deg);
    }
    .leaf-2 {
      width: 680px; height: 680px;
      bottom: -200px; right: -180px;
      background: rgba(46, 46, 126, 0.12);
      transform: rotate(-14deg);
    }
    .leaf-3 {
      width: 260px; height: 260px;
      top: 58%; left: 12%;
      background: rgba(255, 255, 255, 0.10);
      transform: rotate(40deg);
    }

    /* White logo tile, like the app icon in the design */
    .logo {
      position: fixed;
      top: 24px; left: 24px;
      width: 52px; height: 52px;
      border-radius: 16px;
      background: #ffffff;
      display: grid;
      place-items: center;
      box-shadow: 0 12px 24px rgba(46, 46, 126, 0.2);
      z-index: 2;
    }
    .logo::before {
      content: "";
      width: 22px; height: 22px;
      background: #3d3d9e;
      border-radius: 0 100% 0 100%;
      transform: rotate(-8deg);
    }

    /* Top navigation pill, shared by all pages */
    .nav {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 2;
      display: flex;
      gap: 4px;
      padding: 6px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 50px;
      box-shadow: 0 12px 24px rgba(46, 46, 126, 0.15);
    }
    .nav a {
      padding: 10px 20px;
      border-radius: 50px;
      color: #2e2e7e;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }
    .nav a:hover {
      background: rgba(61, 61, 158, 0.1);
    }
    .nav a.active {
      background: #3d3d9e;
      color: #fff;
    }
    @media (max-width: 640px) {
      .nav {
        top: auto;
        bottom: 24px;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
      }
    }

    /* Gallery */
    .page {
      position: relative;
      z-index: 1;
      width: min(1000px, 92vw);
      margin: 0 auto;
      padding: 120px 0 60px;
      text-align: center;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      font-weight: 600;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 4px 18px rgba(46, 46, 126, 0.25);
    }

    .sub {
      margin-top: 0.8rem;
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.9);
    }

    .grid {
      margin-top: 2.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
    }

    .tile {
      aspect-ratio: 1;
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(46, 46, 126, 0.22);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .tile:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 26px 50px rgba(46, 46, 126, 0.3);
    }

    /* Gradient placeholders — swap for real images any time */
    .tile-1 { background: linear-gradient(135deg, #5a5ab8, #2e2e7e); }
    .tile-2 { background: linear-gradient(140deg, #f2c744, #d99a2b); }
    .tile-3 { background: linear-gradient(150deg, #ffffff, #b9bcee); }
    .tile-4 { background: linear-gradient(150deg, #8d90e2, #4a4c9e); }
    .tile-5 { background: linear-gradient(140deg, #ff9a5e, #e8650f); }
    .tile-6 { background: linear-gradient(150deg, #cfd1f5, #7679d2); }
  </style>
</head>
<body>
  <div class="leaf leaf-1"></div>
  <div class="leaf leaf-2"></div>
  <div class="leaf leaf-3"></div>
  <a class="logo" href="index.html" aria-label="Home"></a>
  <nav class="nav" aria-label="Primary">
    <a href="index.html">Home</a>
    <a class="active" href="gallery.html">Gallery</a>
  </nav>

  <main class="page">
    <h1>Gallery</h1>
    <p class="sub">A small collection of gradient studies</p>
    <div class="grid">
      <div class="tile tile-1" role="img" aria-label="Gradient study 1"></div>
      <div class="tile tile-2" role="img" aria-label="Gradient study 2"></div>
      <div class="tile tile-3" role="img" aria-label="Gradient study 3"></div>
      <div class="tile tile-4" role="img" aria-label="Gradient study 4"></div>
      <div class="tile tile-5" role="img" aria-label="Gradient study 5"></div>
      <div class="tile tile-6" role="img" aria-label="Gradient study 6"></div>
    </div>
  </main>
</body>
</html>
